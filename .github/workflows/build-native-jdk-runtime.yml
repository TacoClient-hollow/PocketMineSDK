name: Build PocketBuild Native JDK Runtime
on: [workflow_dispatch]
permissions: {contents: read}
jobs:
  arm64-native-jdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: recipes
      - name: Install Android cross-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint bison build-essential ca-certificates ccache clang cmake curl file flex g++ gawk git gperf gtk-doc-tools libtool libtool-bin ninja-build openjdk-17-jdk patch pkg-config python3 python3-venv rsync unzip wget zip
      - name: Install pinned Android NDK r30
        run: |
          mkdir -p "$HOME/lib"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o /tmp/android-ndk-r30-linux.zip
          unzip -q /tmp/android-ndk-r30-linux.zip -d "$HOME/lib"
          test -d "$HOME/lib/android-ndk-r30"
      - name: Prepare compiler data directory
        run: |
          sudo mkdir -p /data
          sudo chmod 777 /data
      - name: Configure PocketBuild-owned prefix and Android-safe utilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("recipes/scripts/properties.sh")
          text = path.read_text()
          for source, target in {
            'TERMUX__NAME="Termux"': 'TERMUX__NAME="PocketBuild"',
            'TERMUX_APP__PACKAGE_NAME="com.termux"': 'TERMUX_APP__PACKAGE_NAME="io.sphynix.pocketbuild"',
            'TERMUX__ROOTFS_SUBDIR="files"': 'TERMUX__ROOTFS_SUBDIR="files/runtime"'
          }.items():
            if source not in text: raise SystemExit("Required package prefix setting was not found")
            text = text.replace(source, target, 1)
          path.write_text(text)
          PY
          printf '
TERMUX_PKG_EXTRA_CONFIGURE_ARGS+=" --disable-nsenter"
' >> recipes/packages/util-linux/build.sh
      - name: Build native execution base
        working-directory: recipes
        run: ./build-package.sh -a aarch64 termux-exec bash
      - name: Build Java and Gradle from source recipes
        working-directory: recipes
        run: |
          ./build-package.sh -a aarch64 openjdk-21
          ./build-package.sh -a aarch64 gradle git cmake ninja clang aapt apksigner
      - name: Assemble PocketBuild runtime candidate
        run: |
          set -e
          mkdir runtime-root
          for package in recipes/output/*.deb; do dpkg-deb -x "$package" runtime-root; done
          RUNTIME=runtime-root/data/data/io.sphynix.pocketbuild/files/runtime
          test -x "$RUNTIME/usr/lib/jvm/java-21-openjdk/bin/java"
          test -x "$RUNTIME/usr/opt/gradle/bin/gradle"
          mkdir -p "$RUNTIME/bin" "$RUNTIME/home" "$RUNTIME/tmp"
          cat > "$RUNTIME/bin/pocketbuild" <<'EOF'
          #!/system/bin/sh
          ROOT="$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)"
          export PREFIX="$ROOT/usr" JAVA_HOME="$ROOT/usr/lib/jvm/java-21-openjdk"
          export HOME="$ROOT/home" TMPDIR="$ROOT/tmp"
          export PATH="/system/bin:$PREFIX/bin:$JAVA_HOME/bin"
          exec "$ROOT/usr/opt/gradle/bin/gradle" "$@"
          EOF
          chmod 700 "$RUNTIME/bin/pocketbuild"
          echo '{"schema":1,"runtimeVersion":"1.0.0-native-jdk","applicationId":"io.sphynix.pocketbuild","abi":"arm64-v8a","entrypoint":"bin/pocketbuild"}' > "$RUNTIME/runtime.json"
          cd "$RUNTIME"
          zip -qr "$GITHUB_WORKSPACE/pocketbuild-native-jdk-runtime-arm64-v8a.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbuild-native-jdk-runtime-arm64-v8a
          path: pocketbuild-native-jdk-runtime-arm64-v8a.zip
          retention-days: 14
