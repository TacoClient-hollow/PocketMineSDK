name: Build PocketBuild Runtime Base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-runtime-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check out Termux package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages

      - name: Configure PocketBuild private prefix
        working-directory: termux-packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/properties.sh')
          text = path.read_text()
          changes = {
            'TERMUX__NAME="Termux"': 'TERMUX__NAME="PocketBuild"',
            'TERMUX_APP__PACKAGE_NAME="com.termux"': 'TERMUX_APP__PACKAGE_NAME="io.sphynix.pocketbuild"',
            'TERMUX__ROOTFS_SUBDIR="files"': 'TERMUX__ROOTFS_SUBDIR="files/runtime"',
          }
          for old, new in changes.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Build custom Android execution base
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/termux-packages:/home/builder/termux-packages" \
            -w /home/builder/termux-packages \
            termux/package-builder \
            ./build-package.sh -a aarch64 termux-exec bash coreutils

      - name: Extract runtime base
        run: |
          set -euo pipefail
          mkdir -p runtime-root
          find termux-packages/output -type f -name '*.deb' -print0 | while IFS= read -r -d '' pkg; do
            dpkg-deb -x "$pkg" runtime-root
          done
          test -x runtime-root/data/data/io.sphynix.pocketbuild/files/runtime/usr/bin/bash

      - name: Upload base artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbuild-runtime-base-arm64-v8a
          path: runtime-root/data/data/io.sphynix.pocketbuild/files/runtime
          if-no-files-found: error
          retention-days: 7
