name: Build PocketBuild Compiler Runtime
on: [workflow_dispatch]
permissions: {contents: write}
jobs:
  arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Download prebuilt Termux packages
        run: |
          mkdir debs
          python3 - <<'PY'
          import urllib.request
          base='https://packages.termux.dev/apt/termux-main/'
          index=urllib.request.urlopen(base+'dists/stable/main/binary-aarch64/Packages').read().decode()
          items={}
          for block in index.split(chr(10)*2):
            d={}
            for line in block.splitlines():
              if ': ' in line:
                k,v=line.split(': ',1); d[k]=v
            if 'Package' in d: items[d['Package']]=d
          todo=['openjdk-21','gradle','git','cmake','ninja','clang','aapt','apksigner','bash']; got=set()
          while todo:
            n=todo.pop()
            if n in got: continue
            p=items[n]; got.add(n)
            for key in ['Pre-Depends','Depends']:
              for x in p.get(key,'').split(','):
                q=x.strip().split('|')[0].split(' ')[0]
                if q and q not in got: todo.append(q)
          for n in got:
            p=items[n]; urllib.request.urlretrieve(base+p['Filename'],'debs/'+p['Filename'].rsplit('/',1)[-1])
          PY
      - name: Package runtime
        run: |
          mkdir raw runtime runtime/bin runtime/home runtime/tmp
          for x in debs/*.deb; do dpkg-deb -x "$x" raw; done
          cp -a raw/data/data/com.termux/files/. runtime/
          python3 - <<'PY'
          from pathlib import Path
          base = Path("raw/data/data/com.termux/files")
          wanted = ("usr/lib/", "usr/opt/", "usr/bin/")
          with Path("runtime/symlinks.tsv").open("w") as out:
            for path in base.rglob("*"):
              if not path.is_symlink():
                continue
              relative = path.relative_to(base).as_posix()
              if relative.startswith(wanted):
                print(relative, path.readlink().as_posix(), sep=chr(9), file=out)
          PY
          python3 - <<'PY'
          from pathlib import Path
          old = b"/data/data/com.termux/files"
          new = b"/data/data/io.sphynix.pocketbuild/files/runtime"
          for path in Path("runtime").rglob("*"):
            if not path.is_file() or path.name == "symlinks.tsv":
              continue
            data = path.read_bytes()
            if data.startswith(b"ELF"):
              continue
            if old in data:
              path.write_bytes(data.replace(old, new))
          PY
          find runtime -type f -print0 | while IFS= read -r -d '' x; do
            interpreter="$(patchelf --print-interpreter "$x" 2>/dev/null || true)"
            if [ "$interpreter" = "/data/data/com.termux/files/usr/lib/ld-linux-aarch64.so.1" ]; then
              patchelf --set-interpreter /data/data/io.sphynix.pocketbuild/files/runtime/usr/lib/ld-linux-aarch64.so.1 "$x"
            fi
          done
          cat > runtime/bin/pocketbuild <<'EOF'
          #!/system/bin/sh
          RUNTIME="$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)"
          export PREFIX="$RUNTIME/usr" HOME="$RUNTIME/home" TMPDIR="$RUNTIME/tmp"
          export JAVA_HOME="$RUNTIME/usr/lib/jvm/java-21-openjdk" PATH="/system/bin:/system/xbin:$RUNTIME/usr/bin"
          export LD_LIBRARY_PATH="$RUNTIME/usr/lib:$JAVA_HOME/lib"
          exec /system/bin/sh "$RUNTIME/usr/opt/gradle/bin/gradle" "$@"
          EOF
          chmod 755 runtime/bin/pocketbuild
          echo '{"schema":1,"applicationId":"io.sphynix.pocketbuild","abi":"arm64-v8a","entrypoint":"bin/pocketbuild"}' > runtime/runtime.json
          cd runtime; zip -qr ../pocketbuild-runtime-arm64-v8a.zip .
      - name: Publish runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v1
          name: PocketBuild Offline Runtime v1
          body: Android arm64 offline Java, Gradle, CMake, NDK-compatible build tools, and Git runtime for PocketBuild.
          files: pocketbuild-runtime-arm64-v8a.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbuild-compiler-runtime-arm64-v8a
          path: pocketbuild-runtime-arm64-v8a.zip
